<!--Show 2 popup on load-->
<script>
window.onload = function () {

   // Current page path
    const currentPath = window.location.pathname;

    // Pages where popup should be hidden
    const hidePopupPages = [
        '/cgd-hsbc-pay',
        '/schedule-installation',
        '/portal'
    ];

    // Don't show popup on these pages
    if (hidePopupPages.includes(currentPath)) {
        return;
    }

    document.getElementById("popup").style.display = "flex";
};
    // Close single popup
    function closeSinglePopup(id) {
    document.getElementById(id).style.display = "none";
    // Check if both popups are closed
    let popup1 = document.getElementById("popup1").style.display;
    let popup2 = document.getElementById("popup2").style.display;

    if (popup1 == "none" && popup2 == "none") {
        document.getElementById("popup").style.display = "none";
    }
}
</script>
