html {

body {

a {
    font-family: 'Manrope', sans-serif;
}

#mobileOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 1090;
}

#mobileOverlay.active {
    opacity: 1;
    pointer-events: auto;
}

.modern-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1100;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    transition: all 0.3s ease;
    height: 80px;
}

.modern-header.scrolled {
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
}

.header-container {
    max-width: 100%;
    margin: 0 auto;
    padding: 0 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    height: 100%;
}

.logo-wrapper {
    display: flex;
    align-items: center;
}

.logo-wrapper a {
    display: flex;
    align-items: center;
}

.logo-wrapper .logo {
    height: 19px;
    transition: transform 0.3s ease;
}

@media (max-width: 639px) {
    .logo-wrapper .logo {
        height: 35px;
        transition: transform 0.3s ease;
    }
}

.logo-wrapper .logo:hover {
    transform: scale(1.05);
}

/* Navigation */
.main-nav {
    display: flex;
    align-items: center;
    flex: 1;
    justify-content: end;
}

.nav-menu {
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: nowrap;
}

.nav-menu>li {
    position: relative;
}

.main-nav {
    display: flex;
    align-items: center;
    flex: 1;
    justify-content: flex-end;
    min-width: 0;
}

.nav-menu>li>a {
    color: #2c3e50;
    text-decoration: none;
    font-family: 'Manrope', sans-serif;
    font-size: clamp(12px, 0.85vw, 16px);
    font-weight: 500;
    position: relative;
    transition: all 0.3s ease;
    letter-spacing: 0.3px;
    padding: 1rem clamp(1.35rem, 0.8vw, 1rem);
    display: flex;
    align-items: center;
    gap: 0.3rem;
    cursor: pointer;
    white-space: nowrap;
}

.nav-menu>li>a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 3px;
    background: #FF0000;
    transition: width 0.3s ease;
}

.nav-menu>li>a:hover {
    /* color: #FF0000; */
    background: #E1E8F6;
    color: #FF0000;
}

.nav-menu>li>a:hover::after {
    width: 100%;
}

/* Active State for Nav Items - BLUE BACKGROUND */
.nav-menu>li.active>a {
    color: #ffffff;
    background: #FF0000;
}

.nav-menu>li.active>a::after {
    display: none;
}

.nav-menu>li.has-megamenu {
    position: relative;
}

/* Dropdown Arrow - REMOVED */
.nav-menu>li.has-megamenu>a::before {
    display: none;
}

.nav-menu>li.active.has-megamenu>a::before {
    display: none;
}

/* Megamenu Wrapper - Small Box */
.megamenu-wrapper {
    position: absolute;
    top: 100%;
    /* left: 50%; */
    /* transform: translateX(-50%); */
    width: auto;
    padding-top: 0;
    pointer-events: none;
    z-index: 1050;
    margin-top: 0;
}

.nav-menu>li.has-megamenu.active .megamenu-wrapper {
    pointer-events: auto;
}

/* Megamenu Styles - Small Box */
.megamenu {
    background: white;
    min-width: 300px;
    max-width: 400px;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    opacity: 0;
    visibility: hidden;
    /* transform: translateY(-10px); */
    transition: all 0.3s ease;
    overflow: hidden;
}

.nav-menu>li.has-megamenu.active .megamenu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.megamenu-content {
    padding: 1.5rem;
    max-width: 100%;
}

.megamenu-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
}

.megamenu-section h3 {
    color: #FF0000;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0 0 0.8rem 0;
    font-weight: 700;
    display: none;
}

.megamenu-links {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
}

.megamenu-links li {
    margin-bottom: 0;
    position: relative;
}

.megamenu-links a {
    color: #4a5568;
    text-decoration: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.3s ease;
    padding: 0.75rem 0.8rem;
    border-radius: 4px;
}

.megamenu-links a:hover {
    color: #FF0000;
    background: #E1E8F6;
    padding-left: 1.2rem;
}

/* Nested Submenu Styles */
.megamenu-links li.has-submenu {
    position: relative;
}

.megamenu-links li.has-submenu>a {
    cursor: pointer;
}

.submenu-arrow {
    font-size: 0.6rem;
    margin-left: auto;
    transition: transform 0.3s ease;
}

.megamenu-links li.has-submenu.active>a .submenu-arrow {
    transform: rotate(180deg);
}

.submenu-links {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    padding-left: 0.5rem;
}

.megamenu-links li.has-submenu.active .submenu-links {
    max-height: 500px;
    margin-top: 0.3rem;
}

.submenu-links li {
    margin-bottom: 0;
    display: block;
}

.submenu-links a {
    padding: 0.6rem 0.8rem;
    font-size: 0.85rem;
    background: rgba(225, 232, 246, 0.3);
    color: #4a5568;
    display: block;
    border-radius: 2px;
}

.submenu-links a:hover {
    background: #E1E8F6;
    color: #FF0000;
}

/* Mobile Toggle */
.mobile-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 5px;
    z-index: 1101;
    position: relative;
}

.mobile-toggle span {
    width: 28px;
    height: 3px;
    background: #2c3e50;
    border-radius: 3px;
    transition: all 0.3s ease;
}

.mobile-toggle.active span:nth-child(1) {
    transform: rotate(45deg) translateY(8px);
}

.mobile-toggle.active span:nth-child(2) {
    opacity: 0;
}

.mobile-toggle.active span:nth-child(3) {
    transform: rotate(-45deg) translateY(-8px);
}

@media (max-width: 1200px) {
    .logo-wrapper .logo {
        height: 15px;
    }
}

    /* body {

        height: 70px;
    }

        padding: 0 1rem;
    }

        top: 57px;
    }

        top: 110px;
    }

    .mobile-toggle {
        display: flex;
    }

    .main-nav {
        justify-content: flex-end;
    }

    .nav-menu {
        position: fixed;
        top: 70px;
        right: -100%;
        width: 100%;
        height: calc(100vh - 70px);
        background: white;
        flex-direction: column;
        padding: 1rem 0;
        box-shadow: -5px 0 30px rgba(0, 0, 0, 0.2);
        transition: right 0.3s ease;
        gap: 0 !important;
        align-items: flex-start;
        overflow-y: auto;
        z-index: 1100;
        justify-content: flex-start;
    }

    .nav-menu.active {
        right: 0;
    }

    .nav-menu>li {
        width: 100%;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

        padding: 1rem clamp(0.4rem, 0.8vw, 1.2rem);
        font-size: clamp(14px, 0.9vw, 16px);

        border-radius: 0;
    }

        display: none;
    }

        position: static;
        transform: none;
        padding: 0;
        pointer-events: auto;
        top: auto;
        width: 100%;
        z-index: 1050;
    }

        position: static;
        transform: none;
        width: 100%;
        min-width: 100%;
        max-width: 100%;
        box-shadow: none;
        border-radius: 0;
        max-height: 0;
        overflow: hidden;
        opacity: 1;
        visibility: visible;
        background: #f7fafc;
    }

        max-height: 2000px;
    }

        padding: 1rem 1.5rem;
    }

        grid-template-columns: 1fr;
    }

:root {
    /* Theme tokens */
    /* --card-bg-start: #3d3678; */
    /* top-left */
    /* --card-bg-end: #1a1a30; */
    /* bottom-right */
    --card-border: #9FA4A6;
    /* grey/lavender top border */
    --text-strong: #ffffff;
    --text-muted: #c9c9d3;
    --icon-color: #9FA4A6;
    --shadow: 0 18px 40px rgba(20, 16, 50, .45);
    --radius: 6px;
    --gap: 16px;

    /* spacing scale */
    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 20px;
    --s-6: 24px;
    --s-7: 32px;
}


.t-Body-contentInner>.container {
    max-width: 100% !important;
}

.snapshot-card {
    position: relative;
    /* width: min(680px, 92vw); */
    background: linear-gradient(160deg, var(--card-bg-start), var(--card-bg-end));
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    /* for the notch edge alignment */
    isolation: isolate;
    /* keeps internal blend effects contained */
}

/* Decorative angled shapes (very subtle) */
.snapshot-card::before,
.snapshot-card::after {
    content: "";
    position: absolute;
    inset: auto 0 0 auto;
    width: 55%;
    height: 55%;
    background: linear-gradient(145deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, 0));
    transform: skewY(-8deg) translate(8%, 18%);
    filter: blur(0.2px);
    pointer-events: none;
    z-index: 0;
}

.snapshot-card::after {
    inset: 0 auto auto 0;
    width: 35%;
    height: 35%;
    background: linear-gradient(25deg, rgba(255, 255, 255, .03), rgba(255, 255, 255, 0));
    transform: skewY(6deg) translate(-8%, -18%);
}

/* --- Top strip + notch --- */
.card-top {
    /* position: relative; */
    height: 14px;
    background: var(--card-border);
}

.card-top::after {
    /* small raised notch */
    content: "";
    position: absolute;
    left: 72px;
    /* adjust to match your design */
    top: 0;
    width: 110px;
    height: 10px;
    background: var(--card-border);
    border-bottom-left-radius: 6px;
    border-bottom-right-radius: 6px;
    transform: translateY(-4px);
    box-shadow:
        0 1px 0 rgba(255, 255, 255, .35) inset,
        0 3px 6px rgba(9, 9, 18, .25);
}

/* --- Content --- */
.card-body {
    position: relative;
    z-index: 1;
    padding: 28px 28px 26px 28px;
}

.company {
    font-weight: 700;
    font-size: clamp(18px, 2.1vw, 24px);
    letter-spacing: 0.2px;
    margin: 0 0 var(--s-6) 0;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
}

.item {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: var(--s-3);
    align-items: start;
    padding: 10px 0;
    color: var(--text-muted);
    line-height: 1.55;
}

.item+.item {
    border-top: 1px solid rgba(255, 255, 255, .06);
}

.icon {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    color: var(--icon-color);
    opacity: .95;
    flex: none;
}

.label {
    font-size: 12px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #e2dcff;
    opacity: .9;
    margin-right: 6px;
    font-weight: 600;
}

.content {
    font-weight: 500;
    color: #e6e6f2;
}

/* --- Hover subtlety (optional) --- */
.snapshot-card:hover {
    transform: translateY(-1px);
    transition: transform .2s ease;
}

/* --- Responsive tweaks --- */
@media (max-width: 420px) {
    .card-body {
        padding: 22px 18px 20px;
    }

    .company {
        margin-bottom: var(--s-5);
    }

    .item {
        grid-template-columns: 22px 1fr;
    }
}
</style>

(function () {
    const BREAKPOINT = 968;

    const ready = (fn) => {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fn);
        } else {
            fn();
        }
    };

    ready(function () {
        const mobileToggle = document.getElementById('mobileToggle');
        const navMenu = document.getElementById('navMenu');
        const mobileOverlay = document.getElementById('mobileOverlay');
        const header = document.querySelector('.modern-header');
        const megamenuItems = document.querySelectorAll('.has-megamenu');

        if (!header) return;

        const isMobile = () => window.innerWidth <= BREAKPOINT;

        // Close all menus
        const closeAllMenus = () => {
            megamenuItems.forEach(item => item.classList.remove('active'));
            if (navMenu) navMenu.classList.remove('active');
            if (mobileToggle) {
                mobileToggle.classList.remove('active');
                mobileToggle.setAttribute('aria-expanded', 'false');
            }
            if (mobileOverlay) {
                mobileOverlay.classList.remove('active');
                mobileOverlay.setAttribute('aria-hidden', 'true');
            }
            document.body.style.overflow = '';

            // Close all nested submenus
            document.querySelectorAll('.has-submenu').forEach(sub => {
                sub.classList.remove('active');
            });
        };

        // ===== Hamburger toggle =====
        if (mobileToggle && navMenu && mobileOverlay) {
            mobileToggle.addEventListener('click', function (e) {
                e.stopPropagation();
                e.preventDefault();

                const willOpen = !navMenu.classList.contains('active');

                mobileToggle.classList.toggle('active', willOpen);
                navMenu.classList.toggle('active', willOpen);
                mobileOverlay.classList.toggle('active', willOpen);
                mobileOverlay.setAttribute('aria-hidden', willOpen ? 'false' : 'true');
                document.body.style.overflow = willOpen ? 'hidden' : '';
                mobileToggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');

                if (!willOpen) {
                    megamenuItems.forEach(item => item.classList.remove('active'));
                }
            });

            // Overlay click closes everything
            mobileOverlay.addEventListener('click', function () {
                closeAllMenus();
            });
        }

        // ===== Desktop & Mobile: Click-based megamenu =====
        megamenuItems.forEach(item => {
            const link = item.querySelector('a');
            if (!link) return;

            link.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();

                const isActive = item.classList.contains('active');

                // Close all other megamenus
                megamenuItems.forEach(other => {
                    if (other !== item) other.classList.remove('active');
                });

                // Toggle current megamenu
                item.classList.toggle('active', !isActive);
            });
        });

        // ===== Nested submenu toggle =====
        document.querySelectorAll('.has-submenu > a').forEach(submenuLink => {
            submenuLink.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();

                const parentLi = this.closest('.has-submenu');
                const isActive = parentLi.classList.contains('active');

                // Close other submenus at same level
                const siblings = parentLi.parentElement.querySelectorAll('.has-submenu');
                siblings.forEach(sibling => {
                    if (sibling !== parentLi) sibling.classList.remove('active');
                });

                // Toggle current submenu
                parentLi.classList.toggle('active', !isActive);
            });
        });

        // ===== Header scroll effect =====
        const onScroll = () => {
            if (window.scrollY > 50) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        };
        document.addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        // ===== Close on ESC =====
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeAllMenus();
        });

        // ===== Close mobile menu on resize to desktop =====
        window.addEventListener('resize', function () {
            if (!isMobile()) {
                closeAllMenus();
            }
        });

        // ===== Click outside to close =====
        document.addEventListener('click', function (e) {
            const insideHeader = e.target.closest('.modern-header');
            if (!insideHeader) {
                closeAllMenus();
            }
        });

        // Prevent clicks inside megamenu from closing it
        document.querySelectorAll('.megamenu').forEach(menu => {
            menu.addEventListener('click', function (e) {
                e.stopPropagation();
            });
        });
    });
})();




document.addEventListener('DOMContentLoaded', function () {
    const mobileToggle = document.querySelector('.mobile-toggle');
    const navMenu = document.querySelector('.nav-menu');
    const body = document.body;
    const breakpoint = 968;
    // Utility - lock/unlock body scroll
    function lockBody(lock) {
        if (lock) {
            body.style.overflow = 'hidden';
        } else {
            body.style.overflow = '';
        }
    }
    // toggle mobile menu visibility
    function toggleMobileMenu(show) {
        if (!navMenu) return;
        if (show === undefined) navMenu.classList.toggle('active');
        else if (show) navMenu.classList.add('active');
        else navMenu.classList.remove('active');
        // aria
        const expanded = navMenu.classList.contains('active');
        if (mobileToggle) mobileToggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        lockBody(expanded);
    }
    if (mobileToggle) {
        mobileToggle.addEventListener('click', function (e) {
            e.stopPropagation();
            toggleMobileMenu();
        });
    }
    // Accordion behavior for parents (click to expand on mobile)
    const parents = document.querySelectorAll('.has-mega');
    parents.forEach(parent => {
        // set initial aria
        const link = parent.querySelector('.nav-link');
        if (link) link.setAttribute('aria-haspopup', 'true');
        // handle click on the parent link
        parent.querySelector('.nav-link').addEventListener('click', function (e) {
            if (window.innerWidth <= breakpoint) {
                e.preventDefault(); // prevent navigation, treat as accordion toggle
                parent.classList.toggle('active');
                // update aria-hidden on menu
                const menu = parent.querySelector('.mega-menu');
                const isOpen = parent.classList.contains('active');
                if (menu) menu.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
                this.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            }
            // on desktop, default link behavior remains (hover handles showing)
        });
    });
    // Close mobile menu on outside click (when open)
    document.addEventListener('click', function (e) {
        if (!navMenu) return;
        if (!navMenu.classList.contains('active')) return;
        // if click is outside navMenu and outside the toggle
        if (!navMenu.contains(e.target) && !(mobileToggle && mobileToggle.contains(e.target))) {
            toggleMobileMenu(false);
        }
    });
    // Close on ESC
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            toggleMobileMenu(false);
            // close any open accordion
            parents.forEach(p => p.classList.remove('active'));
        }
    });
    // Reset states on resize (if switching to desktop)
    let resizeTimer;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
            // if now desktop width, ensure mobile nav closed & accordions reset
            if (window.innerWidth > breakpoint) {
                toggleMobileMenu(false);
                parents.forEach(p => {
                    p.classList.remove('active');
                    const menu = p.querySelector('.mega-menu');
                    if (menu) menu.setAttribute('aria-hidden', 'true');
                    const link = p.querySelector('.nav-link');
                    if (link) link.setAttribute('aria-expanded', 'false');
                });
            }
        }, 120);
    });
});
