<script>
   $(document).ready(function () {
    // Check if the disclaimer popup has already been displayed in current session
    if (!sessionStorage.getItem('disclaimerPopupDisplayed')) {
        $('#disclaimerPopup').modal('show'); // Show modal on first visit in this session
    }

    // When the close button is clicked, hide the modal and set sessionStorage
    $(".closeDisclaimerPopup").click(function () {
        $('#disclaimerPopup').modal('hide');
        sessionStorage.setItem('disclaimerPopupDisplayed', 'true');
    });
    
    // Manual open from menu (but don't store the flag here)
    $("#openDisclaimer").click(function (e) {
        e.preventDefault(); // Prevent default anchor behavior
        $("#disclaimerPopup").modal("show");
    });
});
</script>    </body>
