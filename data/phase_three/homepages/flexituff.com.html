<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Website Temporarily Unavailable</title>
  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      color:#f5f6f8;
      background:
        radial-gradient(circle at 20% 15%, rgba(196,157,84,.12), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(71,86,140,.10), transparent 28%),
        linear-gradient(145deg,#090b10 0%,#0d1119 55%,#080a0f 100%);
      overflow:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size:54px 54px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);
      pointer-events:none;
    }
    .card{
      width:min(860px,100%);
      padding:72px 52px;
      text-align:center;
      position:relative;
      z-index:1;
      border:1px solid rgba(255,255,255,.10);
      border-radius:30px;
      background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
      box-shadow:0 30px 100px rgba(0,0,0,.38);
      backdrop-filter:blur(18px);
    }
    .icon{
      width:62px;
      height:62px;
      margin:0 auto 28px;
      display:grid;
      place-items:center;
      border-radius:18px;
      border:1px solid rgba(214,182,113,.28);
      background:rgba(214,182,113,.07);
      color:#e5c98d;
      font-size:25px;
      font-weight:700;
    }
    .status{
      display:inline-flex;
      align-items:center;
      gap:9px;
      margin-bottom:22px;
      color:#e5c98d;
      font-size:11px;
      font-weight:700;
      letter-spacing:.14em;
      text-transform:uppercase;
    }
    .dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#d6b671;
      box-shadow:0 0 0 5px rgba(214,182,113,.08);
    }
    h1{
      margin:0;
      font-size:clamp(42px,6vw,72px);
      line-height:1.02;
      letter-spacing:-.045em;
      font-weight:700;
    }
    p{
      max-width:650px;
      margin:26px auto 0;
      color:#aeb4c2;
      font-size:17px;
      line-height:1.7;
    }
    p strong{
      color:#f4f5f7;
      font-weight:600;
    }
    .line{
      width:64px;
      height:1px;
      background:linear-gradient(90deg,transparent,#d6b671,transparent);
      margin:34px auto 0;
    }
    @media(max-width:600px){
      .card{padding:52px 24px;border-radius:22px}
      h1{font-size:42px}
      p{font-size:15px}
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">!</div>

    <div class="status">
      <span class="dot"></span>
      Temporarily Unavailable
    </div>

    <h1>Website is currently unavailable.</h1>

    <p>
      This website is temporarily unavailable due to a
      <strong>technical issue.</strong><br>
      Our team is working to restore the service.
    </p>

    <div class="line"></div>
  </main>
</body>
</html>
