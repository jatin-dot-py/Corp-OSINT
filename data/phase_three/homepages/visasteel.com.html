<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Migrated</title>

    <script>
        // New Website URL
        const redirectURL = "https://www.visachrome.com";

        // Countdown Timer
        let seconds = 60;

        function updateTimer() {
            document.getElementById("timer").innerHTML = seconds;

            if (seconds <= 0) {
                window.location.href = redirectURL;
            }

            seconds--;
        }

        // Start timer
        setInterval(updateTimer, 1000);

        // Redirect on button click
        function redirectNow() {
            window.location.href = redirectURL;
        }
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #d9534f;
            margin-bottom: 20px;
        }

        p {
            color: #444;
            font-size: 18px;
            line-height: 1.6;
        }

        .timer {
            font-size: 22px;
            color: #0078d7;
            font-weight: bold;
            margin: 20px 0;
        }

        button {
            background: #0078d7;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #005ea6;
        }

        a {
            color: #0078d7;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Website Has Moved</h1>

    <p>
        Our website www.visasteel.com has been migrated to a new address.... https://www.visachrome.com
        
        You will automatically be redirected to the new website shortly.
    </p>

    <p>
        New Website:<br>
        <a href="https://www.visachrome.com">https://www.visachrome.com</a>
    </p>

    <div class="timer">
        Redirecting in <span id="timer">60</span> seconds...
    </div>

    <button onclick="redirectNow()">Go to New Website Now</button>

</div>

</body>
</html>
