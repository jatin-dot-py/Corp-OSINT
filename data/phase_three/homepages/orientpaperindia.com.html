<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Your New Website hosted with Easy Space, India</title>
    <style>
        /* Base styles and clean typography */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* The gentle entrance animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* The technical pulsing dot animation */
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        /* Modern Glassmorphism effect */
        .launchpad {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            text-align: center;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        h1 {
            margin-top: 0;
            font-size: 2em;
            color: #2c3e50;
        }

        p.subtitle {
            font-size: 1.1em;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Active Server Status Badge */
        .status-container {
            display: inline-flex;
            align-items: center;
            background: rgba(255,255,255,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #2ecc71;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        /* Clean Navigation Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Card Hover Lift */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            background: #ffffff;
        }

        .card-icon {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        /* Technical Hand-holding Note */
        .footer-note {
            font-size: 0.85em;
            color: #95a5a6;
            margin-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 20px;
        }

        .auto-style1 {
            border-width: 0px;
        }
    </style>
</head>
<body>

    <div class="launchpad">
        <div class="status-container">
            <div class="status-dot"></div>
            Server Connection: Active
        </div>

        <h1>Some Great Things are about to Unfold Here!</h1>
        <p class="subtitle">Your new hosting environment is fully provisioned and ready for deployment.</p>
        
        <p class="subtitle">
            <a href="https://www.ezspl.com">
                <img alt="Easy Space, India. Web Hosting Services - Linux / Windows / Cloud" class="auto-style1" height="86" src="https://www.ezspl.com/assets/img/SkeletonLogo.png" width="250">
            </a>
        </p>

        <div class="footer-note">
            To replace this placeholder page, simply upload your website files to the <strong>public_html</strong> directory via the cPanel File Manager or FTP.
        </div>
    </div>

</body>
</html>
