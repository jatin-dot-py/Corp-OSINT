<!DOCTYPE html>

<html lang="en">

<head>
	<meta charset="UTF-8">

	```
	<title>Health X Platform Limited</title>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: Arial, Helvetica, sans-serif;
			background: #f7f7f7;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.redirect-container {
			width: 90%;
			max-width: 600px;
			background: #ffffff;
			padding: 50px 40px;
			border-radius: 12px;
			text-align: center;
			box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
		}

		.logo {
			width: 180px;
			margin-bottom: 25px;
		}

		h1 {
			color: #183881;
			margin-bottom: 15px;
		}

		h3 {
			font-size: 20px;
			color: #183881;
			margin-bottom: 14px;
		}

		p {
			font-size: 16px;
			color: #555;
			line-height: 1.7;
			margin-bottom: 25px;
		}

		.btn {
			display: inline-block;
			padding: 14px 28px;
			background: #d62828;
			color: #fff;
			text-decoration: none;
			border-radius: 6px;
			font-size: 16px;
			transition: 0.3s;
		}

		.btn:hover {
			background: #b71c1c;
		}

		.loader {
			margin: 25px auto;
			border: 4px solid #f3f3f3;
			border-top: 4px solid #183881;
			border-radius: 50%;
			width: 35px;
			height: 35px;
			animation: spin 1s linear infinite;
		}

		@keyframes spin {
			100% {
				transform: rotate(360deg);
			}
		}

		.small-text {
			margin-top: 20px;
			font-size: 13px;
			color: #888;
		}
	</style>

	<script>
		setTimeout(function () {
			window.location.href = "https://healthxplatform.com/";
		}, 10000);
	</script>
	```

</head>

<body>

	```
	<div class="redirect-container">

		<!-- Logo -->
		<img src="images/SS-logo_SV.jpg" alt="Health X Platform" class="logo">

		<h3>
			Welcome to Health X Platform Limited.<br>
			You are being redirected to our new website.
		</h3>

		<div class="loader"></div>

		<a href="https://healthxplatform.com/" class="btn">
			Go to New Website
		</a>

		<div class="small-text">
			Redirecting automatically in 2 seconds...
		</div>

	</div>
	```

</body>
