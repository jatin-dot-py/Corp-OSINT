<body>
  <div id="root"></div>
  <script>
    (function () {
      var lastScrollY = window.scrollY;

      function getNav() {
        return document.querySelector('header .navbar.fixed-top');
      }

      function setNavVisible(visible) {
        var nav = getNav();
        if (!nav) return;
        nav.classList.toggle('site-nav-hidden', !visible);
        nav.classList.toggle('site-nav-visible', visible);
      }

      function updateHeaderVisibility() {
        var currentScrollY = window.scrollY;
        if (currentScrollY > lastScrollY) setNavVisible(false);
        else if (currentScrollY < lastScrollY) setNavVisible(true);
        else setNavVisible(true);
        lastScrollY = currentScrollY;
      }

      window.addEventListener('scroll', updateHeaderVisibility, { passive: true });
      window.addEventListener('load', function () { setNavVisible(true); });

      if ('MutationObserver' in window) {
        new MutationObserver(function () { setNavVisible(true); }).observe(document.documentElement, { childList: true, subtree: true });
      }
    })();
  </script>
