    <script>
      let dropdownElemts = document.getElementsByClassName("investor-dropdown");
      for (let i = 0; i < dropdownElemts.length; i++) {
        dropdownElemts[i].addEventListener("click", function () {
          let quartelyResultDropdown = document.getElementsByClassName(
            "quarterly-results-mobile"
          )[0];
          let activeElem = document.getElementsByClassName(
            "investor-relation-sub-tab w--current"
          )[0];
          let firstActiveTab = document.getElementsByClassName(
            "investor-relation-sub-tab-1 w--current"
          )[0];
          if (activeElem) {
            activeElem.classList.remove("w--current");
          }
          if (firstActiveTab) {
            firstActiveTab.classList.remove("w--current");
          }
        });
      }
      let quartelyResultDropdown = document.getElementsByClassName(
        "quarterly-results-mobile"
      )[0];
      quartelyResultDropdown.addEventListener("click", function () {
        let quarterlySubTab =
          document.getElementsByClassName("tab-link-tab-1-3")[0];
        quarterlySubTab.classList.add("w--current");
      });
    </script>
    <script>
      let defaultImage = document.getElementsByClassName(
        "image-22 default-show"
      )[0];
      let hoveredImage = document.getElementsByClassName("hover-show")[0];
      defaultImage.addEventListener("mouseenter", function () {
        defaultImage.style.display = "none";
        hoveredImage.style.display = "block";
      });
      hoveredImage.addEventListener("mouseleave", function () {
        hoveredImage.style.display = "none";
        defaultImage.style.display = "block";
      });
    </script>
    <script>
      const video = document.getElementById("video");
      const muted = document.getElementById("muted");
      const unmuted = document.getElementById("unmuted");
      const toggleAudioButton = document.getElementById("toggleAudioButton");
      // Function to toggle video audio
      function toggleAudio() {
        if (video.muted) {
          video.muted = false;
          muted.style.display = "none";
          unmuted.style.display = "inline";
        } else {
          video.muted = true;
          muted.style.display = "inline";
          unmuted.style.display = "none";
        }
      }
      // Add a click event listener to the button
      toggleAudioButton.addEventListener("click", toggleAudio);
    </script>
