<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shayona Engineering Ltd. India</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { primary: "#284695", secondary: "#1CA170" },
            borderRadius: {
              none: "0px",
              sm: "4px",
              DEFAULT: "8px",
              md: "12px",
              lg: "16px",
              xl: "20px",
              "2xl": "24px",
              "3xl": "32px",
              full: "9999px",
              button: "8px",
            },
          },
        },
      };
    </script>
    <style>
    .py-20 {
    padding-top: 10rem !important;
    padding-bottom: 10rem !important;
}
      :where([class^="ri-"])::before { content: "\f3c2"; }
      body {
      font-family: 'Inter', sans-serif;
      }
      .hero-image {
      background-position: right center;
      background-repeat: no-repeat;
      background-size: 55% 100%;
      }
      .doodle {
      position: absolute;
      z-index: 0;
      }
      .program-card {
      transition: all 0.3s ease;
      }
      .program-card:hover {
      transform: translateY(-5px);
      }
      .testimonial-card {
      transition: all 0.3s ease;
      }
      .testimonial-card:hover {
      transform: translateY(-5px);
      }
      .blog-card {
      transition: all 0.3s ease;
      }
      .blog-card:hover {
      transform: translateY(-5px);
      }
    </style>
  </head>
  <body class="bg-cover bg-center" style="background-image: url('https://shayonaengg.com/piping-solutions/wp-content/uploads/2025/07/2-1.jpg');">
    <!-- Header -->
    
    <style>
      .floating-shape {
      position: absolute;
      animation: float 6s ease-in-out infinite;
      opacity: 0.15;
      }
      .shape-1 { animation-delay: 0s; }
      .shape-2 { animation-delay: 1.2s; }
      .shape-3 { animation-delay: 2.4s; }
      .shape-4 { animation-delay: 3.6s; }
      .shape-5 { animation-delay: 4.8s; }
      @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(8deg); }
      }
    </style>
    <!-- Hero Section -->
   
    <!-- Partners Section -->
    <section class="py-20 from-gray-50/50 to-white">
      <div class="container mx-auto px-4">
        <div class="text-center mb-16">
          <h2 class="text-4xl font-bold mb-4 relative inline-block">
            <span class="relative z-10"><h1>Welcome to Shayona Group</h1></span>
            <svg
              class="absolute -bottom-2 left-0 w-full z-0"
              height="8"
              viewBox="0 0 200 8"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M2 5.5C47.5 2.5 148.5 2.5 198 5.5"
                stroke="#2A4899"
                stroke-width="4"
                stroke-linecap="round"
              />
            </svg>
          </h2>
         
        </div>
        <div class="max-w-5xl mx-auto">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="partner-card group">
              <div
                class="bg-white rounded-xl p-10 shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1"
              >
                <div class="h-32 flex items-center justify-center mb-8">
                  <img
                    src="https://shayonaengg.com/piping-solutions/wp-content/uploads/2025/06/new_logo_2-1.png"
                    alt="Shayona Pipe & Fittings Logo"
                    class="max-w-[80%] max-h-full object-contain"
                  />
                </div>
                <a
                  href="https://shayonaengg.com/piping-solutions/"
                  target="_blank"
                  class="inline-flex items-center justify-center w-full bg-white border-2 border-primary text-primary hover:bg-primary hover:text-white px-6 py-3 rounded-button font-medium transition-all duration-300 group-hover:scale-105"
                >
                  <span>Visit Site</span>
                  <i
                    class="ri-arrow-right-line ml-2 transition-transform group-hover:translate-x-1"
                  ></i>
                </a>
              </div>
            </div>
            <div class="partner-card group">
              <div
                class="bg-white rounded-xl p-10 shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1"
              >
                <div class="h-32 flex items-center justify-center mb-8">
                  <img
                    src="https://shayonaengg.com/engineering/wp-content/uploads/2025/06/shayona.png"
                    alt="Shayona Engineering Ltd. Logo"
                    class="max-w-[80%] max-h-full object-contain"
                  />
                </div>
                <a
                  href="https://shayonaengg.com/engineering"
                  target="_blank"
                  class="inline-flex items-center justify-center w-full bg-white border-2 border-primary text-primary hover:bg-primary hover:text-white px-6 py-3 rounded-button font-medium transition-all duration-300 group-hover:scale-105"
                >
                  <span>Visit Site</span>
                  <i
                    class="ri-arrow-right-line ml-2 transition-transform group-hover:translate-x-1"
                  ></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
   
  </body>
</html>
