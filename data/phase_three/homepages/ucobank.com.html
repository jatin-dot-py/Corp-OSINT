



<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UCO Bank</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }
    .modal-header {
      background-color: #1852aa;
      color: white;
    }
    .modal-content {
      border-radius: 10px;
    }
    .modal-body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-section {
      flex: 1;
      text-align: center;
      border-right: 1px solid #dee2e6;
      padding: 20px;
    }
    .text-section {
      flex: 2;
      padding: 20px;
      text-align: center;
    }
    .spinner-border {
      margin-top: 1rem;
    }
  </style>
      <!--Favicon Code start here-->
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
	<meta name="google-site-verification" content="2BwSiJZl9cf2KqTCeguPwicukAxrTTlB77KIt71rt-M" />
</head>
<body>

  <!-- Modal -->
  <div class="modal fade" id="ucoModal" tabindex="-1" aria-labelledby="ucoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="ucoModalLabel">UCO Bank</h5>
        </div>

        <div class="modal-body">
          <!-- Left side: Logo -->
          <div class="logo-section">
            <img src="/o/uco-liferay-theme/images/dummyicons/logo.png" alt="uco Logo" width="100%">
          </div>

          <!-- Right side: Text content -->
          <div class="text-section">
            <h4 class="mb-3">Important Information !</h4> 
            <p class="mb-2">For enhanced security and protection against online frauds, we have migrated our official website from <h6>ucobank.com</h6> to <h6>uco.bank.in</h6> domain </p>
            <!-- <p class="mb-2">You will be automatically redirected to new domain shortly.</p> -->
           <div class="spinner-border text-primary" role="status"></div>
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
     
      if (window.location.hostname === "www.ucobank.com"  || window.location.hostname === "ucobank.com" || window.location.hostname === "uco.bank.in" ||window.location.hostname === "www.uco.bank.in") {
          const modalShown = sessionStorage.getItem("ucoModalShown");
 
          if (!modalShown) {
              const ucoModal = new bootstrap.Modal(document.getElementById('ucoModal'), {
                  backdrop: 'static',
                  keyboard: false
              });
              ucoModal.show();
 
              sessionStorage.setItem("ucoModalShown", "true");
 
              setTimeout(function () {
                  window.location.href = "https://www.uco.bank.in/en/home";
              }, 9000);
          } else {
              window.location.href = "https://www.uco.bank.in/en/home";
          }
      } else {
          // If URL is not www.ucobank.com, redirect to uco.bank.in
          window.location.href = "https://www.uco.bank.in/en/home";
      }
  </script>




</body>
</html>
