<script>
  // ================= Idle scheduler (with fallback) =================
  (function () {
    function scheduleIdle(fn, timeout) {
      // Adaptive timeout: if page is already loaded, fire almost immediately
      if (timeout === undefined) {
        if (document.readyState === 'complete') {
          timeout = 50;   // Page fully loaded — fire ASAP
        } else if (document.readyState === 'interactive') {
          timeout = 200;  // DOM ready, subresources still loading
        } else {
          timeout = 3000; // Still loading — give browser room
        }
      }

      try {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(fn, { timeout });
        } else {
          // Fallback to small timeout to avoid blocking the critical path
          setTimeout(fn, Math.min(timeout, 500));
        }
      } catch {
        setTimeout(fn, 0);
      }
    }
    window.scheduleIdle = scheduleIdle;
  })();

  // ================= Idempotent script loader =================
  (function () {
    const loaded = new Set();

    function loadScript(
      src,
      { async = true, defer = false, onload, attrs = {} } = {}
    ) {
      if (!src || loaded.has(src)) return null;
      loaded.add(src);

      const s = document.createElement('script');
      s.src = src;
      s.async = !!async;
      if (defer) s.defer = true;

      for (const [k, v] of Object.entries(attrs)) s.setAttribute(k, String(v));

      if (typeof onload === 'function') s.addEventListener('load', onload);
      s.addEventListener('error', () => {
        console.warn('Failed to load script:', src);
      });

      document.head.appendChild(s);
      return s;
    }

    window.loadScript = loadScript;
  })();

 // ================= PerformanceObserver for LCP =================
(function () {
  const state = {
    lcpEntry: null,
    lcpFinalized: false,
    lcpSubscribers: [],
    lcpObserver: null,
  };

  window.__bflOnLCP = function (cb) {
    if (state.lcpFinalized && state.lcpEntry) { 
      try { cb(state.lcpEntry); } catch (e) { console.error('Error in LCP subscriber:', e); } 
    } else { 
      state.lcpSubscribers.push(cb); 
    }
  };

  function notifyLCP() {
    if (!state.lcpFinalized || !state.lcpEntry || !state.lcpSubscribers.length) return;
    const payload = state.lcpEntry;
    const subs = state.lcpSubscribers.splice(0);
    for (let i = 0; i < subs.length; i++) {
      try {
        subs[i](payload);
      } catch (e) {
        console.error('Error in LCP subscriber:', e);
      }
    }
  }

  function finalizeLCP() {
    if (state.lcpFinalized) return;
    state.lcpFinalized = true;
    try { state.lcpObserver?.disconnect(); } catch {}
    state.lcpObserver = null;
    notifyLCP();
  }

  window.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') finalizeLCP();
  }, { once: true });

  window.addEventListener('pagehide', finalizeLCP, { once: true });
  window.addEventListener('pointerdown', finalizeLCP, { once: true, passive: true });
  window.addEventListener('keydown', finalizeLCP, { once: true, passive: true });
  window.addEventListener('scroll', finalizeLCP, { once: true, passive: true });

  setTimeout(() => finalizeLCP(), 5000);

  try {
  const lcpObserver = new PerformanceObserver((list) => {
    const entries = list.getEntries();
    if (!entries || entries.length === 0) return;

    const latestCandidate = entries[entries.length - 1];

    if (!latestCandidate.element) {
      state.lcpEntry = latestCandidate;
    } else {
      // Element reference exists — check if still connected
      // to the document root.
      if (latestCandidate.element.isConnected) {
        state.lcpEntry = latestCandidate;
      }
    }
  });
  lcpObserver.observe({ type: 'largest-contentful-paint', buffered: true });
  state.lcpObserver = lcpObserver;
} catch {
  console.warn('⚠️ LCP observer not supported');
  finalizeLCP();
}
})();
</script>

  <script>  
  queueMicrotask(function() {    // Settings
    var maxAgeInMinutes = 35; // Cookie validity in minutes
    var cookieName = "campaignCookie"; // Name of the cookie to store UTM data
    // Default UTM values (for organic/referral fallback)
    var utmSource = "organic_bfl";
    var utmMedium = "bfl";
    var utmCampaign = "NA";
    var utmKeyword = "NA";
    var utmContent = "NA";
    // List of known search engine domains to detect organic traffic
    var searchEngines = [
      "google.",
      "bing.",
      "yahoo.",
      "duckduckgo.",
      "baidu.",
      "yandex.",
      "ask.",
      "aol.",
      "ecosia.",
      "naver.",
      "seznam.",
      "startpage.",
      "qwant.",
    ];
    // Helper: Get cookie value by name
    function getCookieValue(name) {
      var decodedCookie = decodeURIComponent(document.cookie);
      var cookieArray = decodedCookie.split(";");
      for (var i = 0; i < cookieArray.length; i++) {
        var cookie = cookieArray[i];
        while (cookie.charAt(0) === " ") {
          cookie = cookie.substring(1);
        }
        if (cookie.indexOf(name + "=") === 0) {
          return cookie.substring(name.length + 1);
        }
      }
      return false;
    }
    // Helper: Parse all URL parameters into an object
    function getAllUrlParams(url) {
      var queryString = url.split("?")[1] || "";
      var params = queryString.split("&");
      var allParams = {};
      for (var i = 0; i < params.length; i++) {
        var pair = params[i].split("=");
        var key = decodeURIComponent(pair[0]);
        var value = decodeURIComponent(pair[1] || "");
        if (key && key !== '__proto__' && key !== 'constructor' && key !== 'prototype') {
          if (allParams[key]) {
            if (
              Object.prototype.toString.call(allParams[key]) === "[object Array]"
            ) {
              allParams[key].push(value);
            } else {
              allParams[key] = [allParams[key], value];
            }
          } else {
            allParams[key] = value;
          }
        }
      }
      return allParams;
    }

    // Helper: Create or overwrite UTM cookie
    function createUTMCookie(
      utmSource,
      utmMedium,
      utmCampaign,
      utmKeyword,
      utmContent
    ) {
      var utmData = {
        utm_source: utmSource,
        utm_medium: utmMedium,
        utm_campaign: utmCampaign,
        utm_keyword: utmKeyword,
        utm_content: utmContent,
      };
      var cookieValue = JSON.stringify(utmData);
      var expiryDate = new Date(
        new Date().getTime() + maxAgeInMinutes * 60000
      ).toUTCString();
      document['cookie'] =
        cookieName +
        "=" +
        encodeURIComponent(cookieValue) +
        "; path=/; expires=" +
        expiryDate +
        "; Secure; SameSite=Strict; HttpOnly";
    }
    // Sanitize UTM values to prevent cookie injection (CWE-20 / DOM Cookie Poisoning)
    function sanitizeUTMValue(value) {
      if (typeof value !== 'string') return '';
      return value
        .replace(/;/g, '')
        .replace(/"/g, '')
        .replace(/\r/g, '')
        .replace(/\n/g, '')
    }
    // Main function to detect and store UTM/referral info
    function fetch_utm() {
      var params = getAllUrlParams(document.URL);
      // Step 1: UTM parameters found in URL
      if (params.utm_source) {
        utmSource = sanitizeUTMValue(params.utm_source);
        if (params.utm_medium) utmMedium = sanitizeUTMValue(params.utm_medium);
        if (params.utm_campaign) utmCampaign = sanitizeUTMValue(params.utm_campaign);
        if (params.utm_keyword) utmKeyword = sanitizeUTMValue(params.utm_keyword);
        if (params.utm_content) utmContent = sanitizeUTMValue(params.utm_content);
        createUTMCookie(utmSource, utmMedium, utmCampaign, utmKeyword, utmContent);
        return;
      }
      // Step 2: Check if referrer is from a known search engine
      var referrer = document.referrer;
      var isOrganicSearch = false;
      for (var i = 0; i < searchEngines.length; i++) {
        if (referrer.indexOf(searchEngines[i]) > -1) {
          isOrganicSearch = true;
          break;
        }
      }
      if (isOrganicSearch) {
        createUTMCookie(utmSource, utmMedium, utmCampaign, utmKeyword, utmContent);
        return;
      }
      // Step 3: Reuse values from existing cookie if available
      var existingCookie = getCookieValue(cookieName);
      if (existingCookie) {
        var parsed;
        try {
          parsed = JSON.parse(existingCookie);
        } catch (e) {
          parsed = {};
        }
        createUTMCookie(
          sanitizeUTMValue(parsed.utm_source || utmSource),
          sanitizeUTMValue(parsed.utm_medium || utmMedium),
          sanitizeUTMValue(parsed.utm_campaign || utmCampaign),
          sanitizeUTMValue(parsed.utm_keyword || utmKeyword),
          sanitizeUTMValue(parsed.utm_content || utmContent)
        );
        return;
      }
      // Step 4: Use document.referrer as fallback source
      var docReferrer = document.referrer;
      if (docReferrer && docReferrer !== "") {
        docReferrer = sanitizeUTMValue(docReferrer); // Prevent DOM Cookie Poisoning
        var hostname;
        try {
          hostname = document.createElement("a");
          hostname.href = docReferrer;
          utmSource = sanitizeUTMValue(hostname.hostname);
        } catch (e) {
          utmSource = docReferrer;
        }
        utmMedium = "referrer";
        createUTMCookie(utmSource, utmMedium, utmCampaign, utmKeyword, utmContent);
        return;
      }
      // Step 5: Default fallback values
      createUTMCookie(utmSource, utmMedium, utmCampaign, utmKeyword, utmContent);
    }
    // Execute
    fetch_utm();
    // Updated Date - 30-May'25
  }) 
</script>
