<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to New Website</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom styles for this template -->
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .redirect-message {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="redirect-message">
            <h1 class="display-4">Redirecting to New Website</h1>
            <p class="lead">You will be redirected in <span id="countdown">5</span> seconds...</p>
            <!-- Countdown timer script -->
            <script>
                let countdown = 5;

                function updateCountdown() {
                    document.getElementById('countdown').textContent = countdown;
                    countdown--;

                    if (countdown < 0) {
                       window.location.href = 'https://rox-hitech.com/';
                    } else {
                        setTimeout(updateCountdown, 1000); // Update every 1 second
                    }
                }

                // Initial call to start the countdown
                updateCountdown();
            </script>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

</body>

</html>
