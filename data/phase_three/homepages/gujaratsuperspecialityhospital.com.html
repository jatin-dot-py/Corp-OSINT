",\"static/chunks/1356-497180fb2a2b715f.js\",\"2619\",\"static/chunks/2619-b8db57ac19da49ac.js\",\"1931\",\"static/chunks/1931-ca0226e08c463513.js\",\"3575\",\"static/chunks/3575-7ee92fc4efb5220d.js\",\"8215\",\"static/chunks/8215-d38e0da7ddea1d4c.js\",\"8975\",\"static/chunks/8975-4bc46394784397da.js\",\"6791\",\"static/chunks/6791-3d6cf2222a6ae312.js\",\"8974\",\"static/chunks/app/page-dfb5127f1aaf5d79.js\"],\"default\"]\n2d:T3e37,"])</script><script>self.__next_f.push([1,"\u003cdiv class=\"raw-html-embed\"\u003e\u003cdiv class=\"posts-holder\"\u003e\u003cdiv id=\"post-5249\" class=\"page-content post-5249 page type-page status-publish hentry no-post-thumbnail single-page-details\"\u003e\u003csection data-vc-full-width=\"false\" data-vc-full-width-init=\"false\" data-vc-parallax-image=\"https://www.gujaratsuperspecialityhospital.com/wp-content/themes/medservices/images/banner-1.jpg\" data-opacity=\"1\" data-size=\"cover\" data-width=\"100%\" data-parallax_style=\"\" data-position=\"cover\" data-repeat=\"cover\" data-attachment=\"inherit\" class=\"bg-white\"\u003e\u003cdiv id=\"info-4\" class=\"bg-white wide-0 info-section     \"\u003e\u003cdiv class=\"container\"\u003e\u003cdiv class=\"vc_row wpb_row vc_row-fluid bg-tra bg-cover vc_row-o-content-middle vc_row-flex\"\u003e\u003cdiv class=\"wpb_column vc_column_container vc_col-sm-12 bg-tra\"\u003e\u003cdiv class=\"vc_column-inner\"\u003e\u003cdiv class=\"wpb_wrapper \"\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eA New Lease on Life with Our Cutting-Edge Kidney Transplant Services\u003c/h5\u003e\u003cp\u003eKidney Transplant Services at Gujarat Super Speciality Hospital\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003cp\u003eAt Gujarat Super Speciality Hospital in Vadodara, we firmly believe that life should not be limited by renal diseases. For patients with End-Stage-Renal-Disease (ESRD), Renal Transplant (Kidney Transplant) represents the best possible treatment option, offering a renewed lease of life.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eTypes of Kidney Transplants\u003c/h5\u003e\u003cp\u003eWe are committed to offering comprehensive renal transplantation services, providing our patients with a range of donor options:\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eLive Related Renal Transplantation:\u003c/strong\u003e In cases where a patient has a legally acceptable relative ready to donate a kidney, we perform what is known as a “live related renal transplantation.” The potential donors include parents, grandparents, siblings, children, grandchildren, and spouses.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eDeceased/Cadaveric Renal Transplantation:\u003c/strong\u003e If a patient does not have a well-matched relative for donation, they can opt for a deceased or cadaveric Renal transplantation. In this procedure, kidneys are harvested from brain-dead donors and implanted in the patient.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eSwap Renal Transplant:\u003c/strong\u003e Swap Renal transplant is a viable option for patients without a suitable related donor. Here, two families in similar situations swap kidneys to facilitate the transplant.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 20px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003ePreparing for Kidney Transplant\u003c/h5\u003e\u003cp\u003eKidney transplantation involves significant preparations for both the recipient and the donor. A comprehensive medical and psychological evaluation is performed to ensure both parties are fully prepared for the procedure.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eLife Post-Transplant\u003c/h5\u003e\u003cp\u003eFollowing the transplant, patients must continue taking prescribed medications to ensure the proper function of the transplanted kidney. These medications are critical in maintaining kidney graft function and preventing organ rejection. Lifelong follow-up with a nephrologist is also necessary for monitoring the transplanted kidney and overall health.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eThe Transplant Procedure\u003c/h5\u003e\u003cp\u003eDuring the transplant procedure, the new kidney allograft is placed in the lower right abdomen. Interestingly, the original kidneys are typically not removed during this process unless medically necessary.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eGujarat Super Speciality Hospital's Kidney Transplant Center\u003c/h5\u003e\u003cp\u003eOur Kidney Transplant Center offers a full spectrum of renal transplant services, including:\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli\u003eHighly experienced and qualified team of doctors.\u003c/li\u003e\u003cli\u003eRenal transplant program coordinator for patient and relative counseling.\u003c/li\u003e\u003cli\u003eA dedicated Renal Transplant Committee for ethical review and guidance.\u003c/li\u003e\u003cli\u003eStrict infection control practices during kidney harvesting and the entire transplant procedure.\u003c/li\u003e\u003cli\u003eA specialized Renal Transplant ICU for post-operative care and recovery.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 20px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eFrequently Asked Questions\u003c/h5\u003e\u003cp\u003eFind answers to common questions about kidney transplants, including eligibility criteria, the risks and benefits of the procedure, and the steps involved in the transplant process.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-container\" data-vc-action=\"collapseAll\" id=\"kidney-faq\"\u003e\u003cdiv class=\"vc_general vc_tta vc_tta-accordion vc_tta-color-grey vc_tta-style-classic vc_tta-shape-rounded vc_tta-spacing-5 vc_tta-gap-5 vc_tta-controls-align-left vc_tta-o-no-fill vc_tta-o-all-clickable\"\u003e\u003cdiv class=\"vc_tta-panels-container\"\u003e\u003cdiv class=\"vc_tta-panels\"\u003e\u003cdiv class=\"vc_tta-panel\" id=\"1685084090227-15398eb2-7718\" data-vc-content=\".vc_tta-panel-body\"\u003e\u003cdiv class=\"vc_tta-panel-heading\"\u003e\u003ch4 class=\"vc_tta-panel-title vc_tta-controls-icon-position-left\"\u003e\u003ca href=\"#1685084090227-15398eb2-7718\" data-vc-accordion=\"\" data-vc-container=\".vc_tta-container\"\u003e\u003cspan class=\"vc_tta-title-text\"\u003e1. What is the duration of a kidney transplant surgery and how should I prepare for it?\u003c/span\u003e\u003c/a\u003e\u003c/h4\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel-body\"\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eA kidney transplant surgery takes 2-3 hours under general anaesthesia. Fast from midnight the day before and avoid heavy meals the evening before surgery.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel\" id=\"1685084090245-a082a705-1320\" data-vc-content=\".vc_tta-panel-body\"\u003e\u003cdiv class=\"vc_tta-panel-heading\"\u003e\u003ch4 class=\"vc_tta-panel-title vc_tta-controls-icon-position-left\"\u003e\u003ca href=\"#1685084090245-a082a705-1320\" data-vc-accordion=\"\" data-vc-container=\".vc_tta-container\"\u003e\u003cspan class=\"vc_tta-title-text\"\u003e2. What is the success rate of a kidney transplant surgery?\u003c/span\u003e\u003c/a\u003e\u003c/h4\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel-body\"\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eIndia has a high success rate of around 90% for kidney transplant surgery, depending on factors such as healthcare institutes, surgeon expertise, post-operative care, tissue-matching, and donor relation. Post-surgical infections can be a major risk factor affecting success.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel\" id=\"1685084129324-f14c3ae5-5087\" data-vc-content=\".vc_tta-panel-body\"\u003e\u003cdiv class=\"vc_tta-panel-heading\"\u003e\u003ch4 class=\"vc_tta-panel-title vc_tta-controls-icon-position-left\"\u003e\u003ca href=\"#1685084129324-f14c3ae5-5087\" data-vc-accordion=\"\" data-vc-container=\".vc_tta-container\"\u003e\u003cspan class=\"vc_tta-title-text\"\u003e3. Why do I need a kidney transplant? Can I not be on dialysis?\u003c/span\u003e\u003c/a\u003e\u003c/h4\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel-body\"\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eDialysis filters and purifies blood but does not replace all kidney functions. It is costly and requires regular visits to a centre, depleting nutrients and making the blood more toxic over time. Kidney transplant is more economical, and increases survival chances and life expectancy, allowing for a normal and healthy life with physical activities. Dialysis does not allow for a normal life, making kidney transplant the best option for end-stage kidney disease.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel\" id=\"1685084146461-aa2a8c7f-8c84\" data-vc-content=\".vc_tta-panel-body\"\u003e\u003cdiv class=\"vc_tta-panel-heading\"\u003e\u003ch4 class=\"vc_tta-panel-title vc_tta-controls-icon-position-left\"\u003e\u003ca href=\"#1685084146461-aa2a8c7f-8c84\" data-vc-accordion=\"\" data-vc-container=\".vc_tta-container\"\u003e\u003cspan class=\"vc_tta-title-text\"\u003e4. Will my new kidney start work immediately after its transplant?\u003c/span\u003e\u003c/a\u003e\u003c/h4\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel-body\"\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eThe match of a donated kidney to the recipient’s body affects how quickly it starts working. Blood relatives’ kidneys match better due to tissue type and blood connection, starting to function faster than cadaveric kidneys. The new kidney can begin working the same day or take a few weeks depending on these factors.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel\" id=\"1685084164484-704c0ac6-f8e6\" data-vc-content=\".vc_tta-panel-body\"\u003e\u003cdiv class=\"vc_tta-panel-heading\"\u003e\u003ch4 class=\"vc_tta-panel-title vc_tta-controls-icon-position-left\"\u003e\u003ca href=\"#1685084164484-704c0ac6-f8e6\" data-vc-accordion=\"\" data-vc-container=\".vc_tta-container\"\u003e\u003cspan class=\"vc_tta-title-text\"\u003e5. What will be my life expectancy after a kidney transplant?\u003c/span\u003e\u003c/a\u003e\u003c/h4\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel-body\"\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003ePatients of the age group of 40-50 generally have a life expectancy of around 20-22 years after a kidney transplant surgery, while the ones above 50 generally have 15-20 years ahead of them.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel\" id=\"1685084182952-fb289c7a-1426\" data-vc-content=\".vc_tta-panel-body\"\u003e\u003cdiv class=\"vc_tta-panel-heading\"\u003e\u003ch4 class=\"vc_tta-panel-title vc_tta-controls-icon-position-left\"\u003e\u003ca href=\"#1685084182952-fb289c7a-1426\" data-vc-accordion=\"\" data-vc-container=\".vc_tta-container\"\u003e\u003cspan class=\"vc_tta-title-text\"\u003e6. Why is the existing failed kidney not removed when a new kidney is transplanted?\u003c/span\u003e\u003c/a\u003e\u003c/h4\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel-body\"\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eRemoving failed kidneys during a transplant increases surgical risks, even leading to death. Therefore, the new kidney is transplanted in the lower abdomen, leaving the failed kidneys in place to avoid complications.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel\" id=\"1685084198376-0fe12e3d-33df\" data-vc-content=\".vc_tta-panel-body\"\u003e\u003cdiv class=\"vc_tta-panel-heading\"\u003e\u003ch4 class=\"vc_tta-panel-title vc_tta-controls-icon-position-left\"\u003e\u003ca href=\"#1685084198376-0fe12e3d-33df\" data-vc-accordion=\"\" data-vc-container=\".vc_tta-container\"\u003e\u003cspan class=\"vc_tta-title-text\"\u003e7. When is the best time to get a kidney transplant?\u003c/span\u003e\u003c/a\u003e\u003c/h4\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel-body\"\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eA pre-emptive transplant is ideal before dialysis or finding a matching live donor. However, if on dialysis, a kidney transplant is still recommended over remaining on dialysis.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel\" id=\"1685084216855-aa13949f-fc75\" data-vc-content=\".vc_tta-panel-body\"\u003e\u003cdiv class=\"vc_tta-panel-heading\"\u003e\u003ch4 class=\"vc_tta-panel-title vc_tta-controls-icon-position-left\"\u003e\u003ca href=\"#1685084216855-aa13949f-fc75\" data-vc-accordion=\"\" data-vc-container=\".vc_tta-container\"\u003e\u003cspan class=\"vc_tta-title-text\"\u003e8. What happens if I face rejection from my body on the transplanted kidney?\u003c/span\u003e\u003c/a\u003e\u003c/h4\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel-body\"\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eImmunosuppressants help the body accept a new kidney, but rejection can occur if the body recognizes it as foreign. Rejection doesn’t mean the kidney isn’t functioning and typically happens in the first 6 months after a transplant.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel\" id=\"1685084236159-5eaaf149-3e04\" data-vc-content=\".vc_tta-panel-body\"\u003e\u003cdiv class=\"vc_tta-panel-heading\"\u003e\u003ch4 class=\"vc_tta-panel-title vc_tta-controls-icon-position-left\"\u003e\u003ca href=\"#1685084236159-5eaaf149-3e04\" data-vc-accordion=\"\" data-vc-container=\".vc_tta-container\"\u003e\u003cspan class=\"vc_tta-title-text\"\u003e9. What should I take care of before a kidney transplant?\u003c/span\u003e\u003c/a\u003e\u003c/h4\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel-body\"\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eBefore a kidney transplant, patients should consider selecting a nearby transplant centre and anticipate costs such as tests, procurement, surgery, hospital stays, and follow-up appointments.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel\" id=\"1685084304659-266e4dbf-94b1\" data-vc-content=\".vc_tta-panel-body\"\u003e\u003cdiv class=\"vc_tta-panel-heading\"\u003e\u003ch4 class=\"vc_tta-panel-title vc_tta-controls-icon-position-left\"\u003e\u003ca href=\"#1685084304659-266e4dbf-94b1\" data-vc-accordion=\"\" data-vc-container=\".vc_tta-container\"\u003e\u003cspan class=\"vc_tta-title-text\"\u003e10. Which is the best hospital for a kidney transplant in Gujarat?\u003c/span\u003e\u003c/a\u003e\u003c/h4\u003e\u003c/div\u003e\u003cdiv class=\"vc_tta-panel-body\"\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eThe Urology Department at Gujarat Superspeciality Hospital, led by Dr. Pragnesh Bharpoda, specializes in renal transplant surgery and infectious disease management, with an integrated team of expert doctors and specially trained nephrologists focused on patient needs.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eGujarat Super Speciality Hospital: Your Partner on the Journey to Renal Health\u003c/h5\u003e\u003cp\u003eAt Gujarat Super Speciality Hospital, we're not just health care providers - we're your partners in your journey towards improved renal health. Our comprehensive Renal Transplant Services aim to make the journey to renewed health as smooth and comfortable as possible. Embrace life anew, with us by your side.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eContact Us\u003c/h5\u003e\u003cp\u003eIf you or a loved one is considering a kidney transplant, reach out to our team at Gujarat Superspeciality Hospital to learn more about our program and take the first step towards a brighter, healthier future.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_raw_code wpb_content_element wpb_raw_html\"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cdiv class=\"address-container\"\u003e\u003cdiv class=\"icon-container\"\u003e \u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"address-desc\"\u003e \u003cspan class=\"statdesc\"\u003eNear Jetalpur Bridge, Jetalpur Road, Vadodara, Gujarat, 390020\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"phone-container\"\u003e\u003cdiv class=\"icon-container\"\u003e \u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"address-desc\"\u003e \u003cspan class=\"statdesc\"\u003e+91 9687079991\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"email-container\"\u003e\u003cdiv class=\"icon-container\"\u003e \u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"address-desc\"\u003e \u003cspan class=\"statdesc\"\u003efrontdesk@gujaratsuperspecialityhospital.com\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"website-container\"\u003e\u003cd umn_container vc_col-sm-12 bg-tra\"\u003e\u003cdiv class=\"vc_column-inner\"\u003e\u003cdiv class=\"wpb_wrapper \"\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch1 class=\"steelblue-color-color h1-md none\"\u003eTrauma Care Centre\u003c/h1\u003e\u003cp\u003eA trauma care centre in a hospital, that provides care for the patients who have undergone severe traumatic injuries such as gunshot wounds, fall, motor accidents etc. It is also referred to as an emergency department of a hospital known as the “casualty department”.\u003c/p\u003e\u003cp\u003eTrauma centres generally provide specialized medical services to patients who are suffering from traumatic injuries. A good treatment has been proven to reduce the chances of death or permanent disability to patients. For the same reason, trauma centres always have to be prepared to treat the most serious, life-threatening and disabling injuries. However, most trauma centres are within hospitals, they do not intend to replace the main hospital and its emergency department for minor injuries.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eAdvance Critical Care and Trauma Care Centre\u003c/h5\u003e\u003cp\u003eThe trauma centre provides all kinds of thorough services to the injured patient. The trauma management in this hospital starts with the primary survey of the patient which is referred to as the ABCDE method. This includes:\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli style=\"box-sizing: border-box;\"\u003eAirway assessment\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eBreathing\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eCirculation\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eDisability\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eExposure\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003eIn addition to this, there is diagnostic, secondary and tertiary and special cases treatment available with the hospital.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eDiagnostic care includes:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003ePortable X-ray\u003c/li\u003e\u003cli\u003eCT scans\u003c/li\u003e\u003cli\u003eLaboratory test\u003c/li\u003e\u003cli\u003eBlood glucose level\u003c/li\u003e\u003cli\u003eLactate\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003e\u003cstrong\u003eSecondary and tertiary includes:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003ePrimary tests\u003c/li\u003e\u003cli\u003eThorough physical examination\u003c/li\u003e\u003cli\u003eMainly to check for any missed injury\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003eSpecial cases require immediate interventions and special tests. These cases include:\u003c/p\u003e\u003cul\u003e\u003cli\u003eAny injury in bladder or kidney\u003c/li\u003e\u003cli\u003ePenetration wounds and gunshot ones are operated.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eFacilities\u003c/h5\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli\u003eThe hospital has an advanced trauma care centre. The doctors and the healthcare team are specialized in taking the ultimate care of the injured and traumatized person.\u003c/li\u003e\u003cli\u003eThe thorough diagnosis and fast interventions have proven to deliver immediate aid to the patients with fast recovery.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003eThe hospital is focused on providing all kinds of immediate aid to their patients who are in urgent need of trauma care making sure that none of the patients are left untreated.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"vc_row-full-width vc_clearfix\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"30:T10d9,"])</script><script>self.__next_f.push([1,"\u003cdiv class=\"raw-html-embed\"\u003e\u003cdiv class=\"posts-holder\"\u003e\u003cdiv id=\"post-3570\" class=\"page-content post-3570 page type-page status-publish hentry no-post-thumbnail single-page-details\"\u003e\u003csection data-vc-full-width=\"false\" data-vc-full-width-init=\"false\" data-vc-parallax-image=\"https://www.gujaratsuperspecialityhospital.com/wp-content/themes/medservices/images/banner-1.jpg\" data-opacity=\"1\" data-size=\"cover\" dat so that they can be eased out of the condition or the disease that they are suffering from.\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eA vast range of services are offered in the hospital which are Microdiscectomy, Endoscopic Spine Surgery, Corrective Surgery for Scoliosis Disc Replacement, Comprehensive Management of Spine Injuries, Computer Navigation aided Spine Instrumentation and other procedures.\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eThe hospital consists of a multidisciplinary team which offers a holistic approach to the management of spinal problems.\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eAll the treatments offered here are comprehensive, thorough, tailored to meet individual needs, patient-friendly and holistic.\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eThe hospital offers a wide range of services to patients with spine related problems including Patient education and support, rehabilitation and Spinal physiotherapy, Spinal injection therapy, Management of chronic pain, Spinal surgery.\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eThe hospital deals with conditions such as low back pain, spinal tumors, metabolic diseases (osteoporosis), fractures, spinal malformation and devastating spinal cord injuries.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 20px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eFacilities\u003c/h5\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli\u003eFor correct diagnoses and increased safety during therapeutic processes, the specialists in the hospital use the most advanced techniques available for interventional neuroradiology, p\u003eOther than the gastroenterologists, there are a number of other specialized doctors who mutually work together to provide the necessary gastroenterology services to the patients.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eServices\u003c/h5\u003e\u003cp\u003eThe hospital provides a thorough gastroenterology service to the patients. All the patients suffering from any of the gastroenterological disorders are provided with quality and satisfactory services for their aid. Attentive personal care is delivered to the patients. The healthcare team works with the doctor and the patient to provide the best cure. The services are as follows:\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli\u003eColonoscopy is done to detect the problems or abnormalities of the small and large intestines.\u003c/li\u003e\u003cli\u003eUltimate screening and surveillance are offered for the best cure of the patients.\u003c/li\u003e\u003cli\u003eEndoscopy, gastro intestinal disorder, liver disorder and pancreatic disorder are some of the other treatment services that are provided by the hospital.\u003c/li\u003e\u003cli\u003eOther than that, the hospital provides radiology and laparoscopic treatment as well so that patients are able to get all services under one roof.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 20px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eFacilities\u003c/h5\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli\u003eThe hospital has a state of art gastroenterology department aimed to provide the best of the facilities to the patients by the use of the latest surgical and medical inventions.\u003c/li\u003e\u003cli\u003eThe therapeutic gastroenterology program delivers the patients with early diagnosis and fast recovery from the disease.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 20px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003eThe hospital is focused on providing all the necessary gastroenterological services to the patients so that all the disorders can be treated efficiently and effectively at the same time. The hospital offers 24/7 service which works best during an emergency.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"vc_row-full-width vc_clearfix\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"33:Td07,"])</script><script>self.__next_f.push([1,"\u003cdiv class=\"raw-html-embed\"\u003e\u003cdiv class=\"vc_row wpb_row vc_row-fluid top-row mb-40 bg-tra bg-inherit vc_row-o-content-middle vc_row-flex\"\u003e\u003cdiv class=\"wpb_column vc_column_container vc_col-sm-12 bg-tra\"\u003e\u003cdiv class=\"vc_column-inner\"\u003e\u003cdiv class=\"wpb_wrapper \"\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003cp\u003eA hernia is basically a weakness or tear in the abdominal muscles that allows organs, such as intestines or fatty tissue, to protrude through the weakened area. This causes a bulge under the skin accompanied with pain and discomfort.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eCauses of Hernia\u003c/h5\u003e\u003cp\u003eThe most common cause of hernia is a defect or weakness in the abdominal wall that was present at birth. The area can be further weakened by age or injury. Additionally, the weakness might occur as a result of a previous surgical incision. Hernias are more common in men but can develop in anyone. Some of the major risk factors are as follows.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli style=\"box-sizing: border-box;\"\u003eChronic cough\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eSmoking\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eObesity\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eStraining while lifting heavy objects\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eStraining during bowel movements or urination\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003ePregnancy\u003c/li\u003e\u003cli style=\"box-sizing: border-box;\"\u003eCertain medications like steroids\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 20px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eTypes of Hernias\u003c/h5\u003e\u003cp\u003eAll hernias are not created equal. They are characterized by their location in the abdominal wall and occasionally by their specific cause. Based on that there are three common types of hernias.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"black-color h5-md none\" style=\"font-weight: normal;\"\u003eInguinal Hernia\u003c/h5\u003e\u003cp\u003eThis is the most common type of hernia and is more common in the men as compared to women. This is due to a potential weak spot in the groin when a male’s testicles descend during foetal development. An indirect inguinal hernia which is rare is the type of hernia that develops in this weak spot. The hernia may then descend into the scrotum in men or, in women, to the outer folds of the vagina.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"black-color h5-md none\" style=\"font-weight: normal;\"\u003eUmbilical Hernia\u003c/h5\u003e\u003cp\u003eAn umbilical hernia occurs in the weakened area of the navel or belly button where the umbilical cord was attached. These are more frequent in children, but are also seen in adults as well.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"black-color h5-md none\" style=\"font-weight: normal;\"\u003eIncisional Hernia\u003c/h5\u003e\u003cp\u003eAn incisional hernia as indicated by the name is located at the site of a previous surgical incision. Any previous areas of surgery remain weak throughout the life of the individual and hernias can develop at this site after weeks, months or even years after the initial surgery.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"34:Tf2b,"])</script><script>self.__next_f.push([1,"\u003cdiv class=\"raw-html-embed\"\u003e\u003cdiv class=\"posts-holder\"\u003e\u003cdiv id=\"post-3561\" class=\"page-content post-3561 page type-page status-publish hentry no-post-thumbnail single-page-details\"\u003e\u003csection data-vc-full-width=\"false\" data-vc-full-width-init=\"false\" data-vc-parallax-image=\"https://www.gujaratsuperspecialityhospital.com/wp-content/themes/medservices/images/banner-1.jpg\" data-opacity=\"1\" data-size=\"cover\" data-width=\"100%\" data-parallax_style=\"\" data-position=\"cover\" data-repeat=\"cover\" data-attachment=\"inherit\" class=\"bg-white vc_custom_1643618401685\"\u003e\u003cdiv id=\"info-4\" class=\"bg-white wide-0 info-section     \"\u003e\u003cdiv class=\"container\"\u003e\u003cdiv class=\"vc_row wpb_row vc_row-fluid top-row mb-40 bg-tra bg-inherit vc_row-o-content-middle vc_row-flex\"\u003e\u003cdiv class=\"wpb_column vc_column_container vc_col-sm-12 bg-tra\"\u003e\u003cdiv class=\"vc_column-inner\"\u003e\u003cdiv class=\"wpb_wrapper \"\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003cp\u003eNeuro Surgery is the surgery which deals with the disorders of the nervous system. It is the medical specialty which is concerned with the treatment and diagnosis of patients with injury to the spinal column, spinal cord, peripheral nerves within the body or disorders and diseases of the brain. Thus, it is clear that the surgery deals with the brain, spine and central nervous system.\u003c/p\u003e\u003cp\u003eThe area of expertise of neurosurgical care involves both pediatric and adult patients. Depending on the nature of the disease or injury a neurological surgeon may prescribe surgical as well as non-surgical care.\u003c/p\u003e\u003cp\u003eNeurosurgeons are not just brain surgeons, they are medically trained neurosurgical specialists who can also assist patients suffering from neck and back pain as well as other illnesses ranging from head injury to trigeminal neuralgia and Parkinson's disease.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eServices\u003c/h5\u003e\u003cp\u003eThe hospital is dedicated to offer world class neurosurgery services to the patients so that they can be eased out of the condition or the disease that they are suffering from. A vast range of services are offered in the hospital which are as follows.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli\u003eThe department of neuro surgery services in the hospital has been the pioneer in this area in introducing state treatment modalities using endoscope and operating microscope for the treatment of numerous neurological disorders.\u003c/li\u003e\u003cli\u003eThe post-operative facilities and critical care of the hospital are excellent and offer the patients the best chance for recovery.\u003c/li\u003e\u003cli\u003eDisorders of the nervous system such as epilepsy, dementia, chronic pain, movement disorders, headaches, sleep disorders, multiple sclerosis, and various other\u0026nbsp;neuro-muscular diseases\u0026nbsp;are handled here efficiently.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 20px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eFacilities\u003c/h5\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli\u003eThe hospital is regarded as one of the leading centers in the country. This has been possible because of the applauded team of neurosurgeons and neurologists, the infrastructure of the hospital and the advanced therapeutic and diagnostic technologies that are available.\u003c/li\u003e\u003cli\u003eThe hospital has a state of art, neuro interventional Cath lab, neuro ICU and an acute stroke unit present to deal with all sorts of neuro emergency situations effectively.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe hospital has all the required infrastructure for offering the best neuro surgery services to the patients.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"vc_row-full-width vc_clearfix\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"35:T10cb,"])</script><script>self.__next_f.push([1,"\u003cdiv class=\"raw-html-embed\"\u003e\u003cdiv class=\"posts-holder\"\u003e\u003cdiv id=\"post-3527\" class=\"page-content post-3527 page type-page status-publish hentry no-post-thumbnail single-page-details\"\u003e\u003cdiv class=\"vc_row-full-width vc_clearfix\"\u003e\u003cbr\u003e\u003cdiv id=\"info-4\" class=\"bg-white wide-0 info-section     \"\u003e\u003cdiv class=\"container\"\u003e\u003cdiv class=\"vc_row wpb_row vc_row-fluid top-row mb-40 bg-tra bg-inherit vc_row-o-content-middle vc_row-flex\"\u003e\u003cdiv class=\"wpb_column vc_column_container vc_col-sm-12 bg-tra\"\u003e\u003cdiv class=\"vc_column-inner\"\u003e\u003cdiv class=\"wpb_wrapper \"\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch1 class=\"Default h1-xs none section-id blue-color\" style=\"font-size: 1rem;\"\u003eCardiac Care at Gujarat Superspeciality Hospital in Vadodara\u003c/h1\u003e\u003ch1 class=\"steelblue-color-color h1-md none\"\u003eWhat is a Cardiac Care Unit?\u003c/h1\u003e\u003cp\u003e\u003ca href=\"https://www.gujaratsuperspecialityhospital.com/cardiac-care/\"\u003e\u003cstrong\u003eCardiac Care is a specialized hospital\u003c/strong\u003e\u003c/a\u003e ward designated to treat people with serious and acute heart illnesses. Those who undergo heart surgeries are placed in the \u003ca href=\"https://www.gujaratsuperspecialityhospital.com/cardiac-care-at-gujarat-superspeciality-hospital/\"\u003e\u003cstrong\u003eCardiac Care Unit (CCU)\u003c/strong\u003e\u003c/a\u003e as they recover. These wards are equipped to supply \u003ca href=\"https://www.gujaratsuperspecialityhospital.com/understanding-cardiac-arrest-symptoms-precautions-and-treatment/\"\u003e\u003cstrong\u003especialized treatments for heart conditions\u003c/strong\u003e\u003c/a\u003e and are staffed with professional medical staff in cardiac care.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_row wpb_row vc_row-fluid top-row mb-40 bg-tra bg-inherit vc_row-o-content-middle vc_row-flex\"\u003e\u003cdiv class=\"wpb_column vc_column_container vc_col-sm-12 bg-tra\"\u003e\u003cdiv class=\"vc_column-inner\"\u003e\u003cdiv class=\"wpb_wrapper \"\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eWhat are the issues managed within the Cardiac Care Unit?\u003c/h5\u003e\u003cp\u003ePatients admitted to the CCU for serious, acute, and \u003ca href=\"https://www.gujaratsuperspecialityhospital.com/understanding-cardiac-arrest-symptoms-precautions-and-treatment/\"\u003e\u003cstrong\u003eunstable cardiac conditions\u003c/strong\u003e\u003c/a\u003e require round-the-clock monitoring and \u003ca href=\"https://www.gujaratsuperspecialityhospital.com/cardiac-treatments-at-gujarat-kidney-hospital/\"\u003e\u003cstrong\u003especialized cardiovascular therapy\u003c/strong\u003e\u003c/a\u003e.\u003c/p\u003e\u003cp\u003eThe most common of those is acute heart failure or another kind of acute coronary syndrome. People with these conditions are at risk of rapid, unexpected changes in their condition and typically require ongoing therapy, like targeted temperature management (inducing mild hypothermia).\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003eOther patients who may require a stay at CCU includes:\u003c/p\u003e\u003cul\u003e\u003cli\u003eThose who have decompensated failure, especially if they’re especially ill/unstable or need a balloon pump or LVAD\u003c/li\u003e\u003cli\u003eRequire close monitoring following severe heart conditions, whether or not they’ve stabilized, and are awaiting a heart transplant\u003c/li\u003e\u003cli\u003eHave acute coronary syndromes, unstable angina, or life-threatening cardiac arrhythmias\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThere can be a range of \u003ca href=\"https://www.gujaratsuperspecialityhospital.com/understanding-cardiac-arrest-symptoms-precautions-and-treatment/\"\u003e\u003cstrong\u003ecardiac diseases\u003c/strong\u003e\u003c/a\u003e that need special attention from an advanced hospital that has all the latest technology to carry out proper \u003cstrong\u003e\u003ca href=\"https://www.gujaratsuperspecialityhospital.com/our-latest-cath-lab-helps-increase-safety-during-cardiac-procedures/\" target=\"_blank\" rel=\"noopener\"\u003etests and diagnose the disease\u003c/a\u003e\u003c/strong\u003e correctly.\u003c/p\u003e\u003cp\u003eThe \u003ca href=\"https://www.gujaratsuperspecialityhospital.com/cardiac-treatments-at-gujarat-kidney-hospital/\" target=\"_blank\" rel=\"noopener\"\u003e\u003cstrong\u003ehospital is focused on providing all the necessary cardiac, heart \u0026amp; kidney services\u003c/strong\u003e\u003c/a\u003e to the patients so that all the disorders can be treated efficiently and effectively at the same time. The hospital offers 24/7 service which works best during an emergency.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_row-full-width vc_clearfix\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u0026nbsp;\u003cbr\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"36:T21d5,"])</script><script>self.__next_f.push([1,"\u003cdiv class=\"posts-holder\"\u003e\u003cdiv id=\"post-3112\" class=\"page-content post-3112 page type-page status-publish hentry no-post-thumbnail single-page-details\"\u003e\u003cdiv class=\"vc_row-full-width vc_clearfix\"\u003e\u003cdiv id=\"info-4\" class=\"bg-white wide-0 info-section     \"\u003e\u003cdiv class=\"container\"\u003e\u003cdiv class=\"vc_row wpb_row vc_row-fluid top-row mb-40 bg-tra bg-inherit vc_row-o-content-middle vc_row-flex\"\u003e\u003cdiv class=\"wpb_column vc_column_container vc_col-sm-12 bg-tra\"\u003e\u003cdiv class=\"vc_column-inner\"\u003e\u003cdiv class=\"wpb_wrapper \"\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch1 class=\"steelblue-color-color h1-md none\"\u003eUrology treatment in Vadodara\u003c/h1\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_row wpb_row vc_row-fluid top-row mb-40 bg-tra bg-inherit vc_row-o-content-middle vc_row-flex\"\u003e\u003cdiv class=\"wpb_column vc_column_container vc_col-sm-12 bg-tra\"\u003e\u003cdiv class=\"vc_column-inner\"\u003e\u003cdiv class=\"wpb_wrapper \"\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003cp\u003eThe Department of Urology at Gujarat Superspeciality Hospital offers the best facilities for the diagnosis and treatment of genitourinary problems in adults and children.\u003c/p\u003e\u003cp\u003eA highly qualified and experienced team of dedicated urologists and resident surgeons are available 24 hours a day. The latest state-of-the-art technology and equipment are available.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eServices\u003c/h5\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003e1. Endourology\u003c/h5\u003e\u003cp\u003eEndoscopic treatment of stones and diseases of the kidney, ureter, bladder, prostate and urethra.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli\u003ePercutaneous nephrolithotomy PCNL\u003c/li\u003e\u003cli\u003eRetrograde Intrarenal Surgery (RIRS)\u003c/li\u003e\u003cli\u003eUreteroscopy\u003c/li\u003e\u003cli\u003eFlexible ureteroscopy and laser lithotripsy\u003c/li\u003e\u003cli\u003eTransurethral Resection of the Prostate (TURP)\u003c/li\u003e\u003cli\u003eTransurethral Resection of Bladder Tumour (TURBT)\u003c/li\u003e\u003cli\u003eEndopyelotomy and retrograde endopyelotomy\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003e2. Laparoscopic Urology\u003c/h5\u003e\u003cp\u003eKey - hole surgery to remove and reconstruct urinary organs avoiding pain and long bed rest associated with open surgery.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli style=\"list-style-type: none;\"\u003e\u003cul\u003e\u003cli\u003eLaparoscopic and retroperitoneoscopic adrenalectomy\u003c/li\u003e\u003cli\u003eLaparoscopic and retroperitoneoscopic nephrectomy and radical nephrectomy, laparoscopic nephron sparing surgeries\u003c/li\u003e\u003cli\u003eLaparoscopic pyeloplasty\u003c/li\u003e\u003cli\u003eLaparoscopic radical prostatectomy\u003c/li\u003e\u003cli\u003eLaparoscopic donor nephrectomy\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003e3. Urological Oncology\u003c/h5\u003e\u003cp\u003eThe Department of Urology has a separate division for urological malignancies. The cancers of kidney, bladder, prostate, ureters, adrenals, testis and penis are taken care of by this section.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cp\u003eProstate Cancer\u003c/p\u003e\u003cul style=\"margin-bottom: 20px;\"\u003e\u003cli\u003eOpen and laparoscopic radical prostatectomy\u003c/li\u003e\u003cli\u003eHormonal treatment\u003c/li\u003e\u003cli\u003eChemotherapy\u003c/li\u003e\u003cli\u003eRadioisotope treatment\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eKidney Tumors\u003c/p\u003e\u003cul style=\"margin-bottom: 20px;\"\u003e\u003cli\u003eRadical nephrectomy: open and laparoscopic\u003c/li\u003e\u003cli\u003eNephron sparing surgeries: open and laparoscopic\u003c/li\u003e\u003cli\u003eRadiofrequency Ablation (RFA)\u003c/li\u003e\u003cli\u003eImmunotherapy\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eTesticular Tumors\u003c/p\u003e\u003cul style=\"margin-bottom: 20px;\"\u003e\u003cli\u003eInguinal orchiectomy\u003c/li\u003e\u003cli\u003eRetroperitoneal lymph node dissection\u003c/li\u003e\u003cli\u003eChemotherapy and radiotherapy\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eBladder Cancer\u003c/p\u003e\u003cul style=\"margin-bottom: 20px;\"\u003e\u003cli\u003eRadical cystectomy and conduit\u003c/li\u003e\u003cli\u003eOrthotopic neobladder\u003c/li\u003e\u003cli\u003eBladder preservation\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePenile Cancer\u003c/p\u003e\u003cp\u003eThe laparoscopic surgery has changed the surgical concept in Uro-oncology. Most of the open surgeries like radical nephrectomy, nephro ureterectomy, radical prostatectomy and radical cystectomy are now done more and more with minimum morbidity and early return to work.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003e4. Pediatric Urology\u003c/h5\u003e\u003cp\u003eExpertise for the surgical reconstruction of congenital defects of the urinary tract either by open surgery or laparoscopy is available.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli style=\"list-style-type: none;\"\u003e\u003cul\u003e\u003cli\u003ePediatric pyeloplasty: Lap/open\u003c/li\u003e\u003cli\u003ePediatric adrenalectomy: Lap/open\u003c/li\u003e\u003cli\u003ePUV fulguration\u003c/li\u003e\u003cli\u003eUreteric reimplantation: (Lap/open) and STING surgery\u003c/li\u003e\u003cli\u003eHypospadias repair\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003e5. Female Urology\u003c/h5\u003e\u003cp\u003eTreatment of women with incontinence of urine and management of urinary problems in patients.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli style=\"list-style-type: none;\"\u003e\u003cul\u003e\u003cli\u003eTVT (TransVaginal Tape)\u003c/li\u003e\u003cli\u003eTOT (TransObturator Tape)\u003c/li\u003e\u003cli\u003eReconstructive surgery for Vesicovaginal fistula (VVF)\u003c/li\u003e\u003cli\u003eUreterovaginal fistula (UVF).\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003e6. Andrology\u003c/h5\u003e\u003cp\u003eEvaluation methods for erectile dysfunction including pharmacy cavernosometry, pharmaco cavernosography and procedures like penile implantation surgery are done regularly.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli style=\"list-style-type: none;\"\u003e\u003cul\u003e\u003cli\u003ePharmaco cavernosography and cavernosometry\u003c/li\u003e\u003cli\u003ePenile prosthesis implantation\u003c/li\u003e\u003cli\u003ePenile vascular reconstruction\u003c/li\u003e\u003cli\u003eSurgeries for Peyronie’s Disease\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003e7. General Urology\u003c/h5\u003e\u003cp\u003eStones in the kidney, ureter, bladder, common diseases of the urethra (stricture), prostate (cancer, enlargement) and bladder are routinely treated. All the advanced treatment options for stones in the kidney and other parts of the urinary tract are available.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003e8. Robotic Surgery in Urology\u003c/h5\u003e\u003cp\u003eIn traditional open surgery, a large incision, up to eight inches, might be required in order for the surgery to be performed. However, when Robotic Surgery is performed, the size of the incisions is much smaller and it is a minimally invasive procedure.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli\u003eRobotic Radical Prostatectomy\u003c/li\u003e\u003cli\u003eRobotic Radical Nephrectomy\u003c/li\u003e\u003cli\u003eRobotic Partial Nephrectomy\u003c/li\u003e\u003cli\u003eRobotic Cystoprostatectomy\u003c/li\u003e\u003cli\u003eRobotic Pyeloplasty\u003c/li\u003e\u003cli\u003eRobotic Ureteric Reimplantation\u003c/li\u003e\u003cli\u003eRobotic VVF Repair\u003c/li\u003e\u003cli\u003eRobotic Boari Flap\u003c/li\u003e\u003cli\u003eRobotic Partial Cystectomy\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_empty_space\" style=\"height: 32px\"\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003cp\u003eThe outpatient urology department has facilities to take care of all office urology procedures. It is supported by trained staff including two staff nurses, blood draw facilities, full-fledged procedure rooms, dedicated X-ray machines, ultrasound equipment, etc.\u003c/p\u003e\u003cp\u003eThe Versius system is the most used robotic system in the world, it is a sophisticated tool to help surgeons deliver the highest quality surgical care to patients.\u003c/p\u003e\u003cp\u003eWe at Gujarat Superspeciality Hospital, believe that our patients should be receiving the highest quality care and treatments at the right time. By introducing Robotic Surgery for the first time in Vadodara, we aim to provide robotics as a solution to bringing minimal access surgery to more people.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"vc_row-full-width vc_clearfix\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"37:T13e2,"])</script><script>self.__next_f.push([1,"\u003cdiv class=\"raw-html-embed\"\u003e\u003cdiv class=\"posts-holder\"\u003e\u003cdiv id=\"post-3512\" class=\"page-content post-3512 page type-page status-publish hentry no-post-thumbnail single-page-details\"\u003e\u003csection data-vc-full-width=\"false\" data-vc-full-width-init=\"false\" data-vc-parallax-image=\"https://www.gujaratsuperspecialityhospital.com/wp-content/themes/medservices/images/banner-1.jpg\" data-opacity=\"1\" data-size=\"cover\" data-width=\"100%\" data-parallax_style=\"\" data-position=\"cover\" data-repeat=\"cover\" data-attachment=\"inherit\" class=\"bg-white vc_custom_1643612839112\"\u003e\u003cdiv id=\"info-4\" class=\"bg-white wide-0 info-section     \"\u003e\u003cdiv class=\"container\"\u003e\u003cdiv class=\"vc_row wpb_row vc_row-fluid top-row mb-40 bg-tra bg-inherit vc_row-o-content-middle vc_row-flex\"\u003e\u003cdiv class=\"wpb_column vc_column_container vc_col-sm-12 bg-tra\"\u003e\u003cdiv class=\"vc_column-inner\"\u003e\u003cdiv class=\"wpb_wrapper \"\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch1 class=\"steelblue-color-color h1-md none\"\u003eNephrology\u003c/h1\u003e\u003cp\u003eThe branch of medical science and study that deals distinctly in the medicine and pediatrics related to the functioning of the kidney is known as nephrology. Besides that, it also concerns any kidney disease, preserving the health of the kidneys, diagnosis and treatment of ill condition of the kidneys, kidney stone, and medication for dysfunction or renal replacement therapy. A nephrologist is in charge of carrying out examinations on the patient who complains of any malfunction related to kidneys. In normal cases, medication can improve whereas extreme conditions require surgical help.\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"vc_row-full-width vc_clearfix\"\u003e\u003cbr\u003e\u003c/div\u003e\u003csection data-vc-full-width=\"false\" data-vc-full-width-init=\"false\" data-vc-parallax-image=\"https://www.gujaratsuperspecialityhospital.com/wp-content/themes/medservices/images/banner-1.jpg\" data-opacity=\"1\" data-size=\"cover\" data-width=\"100%\" data-parallax_style=\"\" data-position=\"cover\" data-repeat=\"cover\" data-attachment=\"inherit\" class=\"bg-white\"\u003e\u003cdiv id=\"info-4\" class=\"bg-white wide-0 info-section     \"\u003e\u003cdiv class=\"container\"\u003e\u003cdiv class=\"vc_row wpb_row vc_row-fluid top-row mb-40 bg-tra bg-inherit vc_row-o-content-middle vc_row-flex\"\u003e\u003cdiv class=\"wpb_column vc_column_container vc_col-sm-12 bg-tra\"\u003e\u003cdiv class=\"vc_column-inner\"\u003e\u003cdiv class=\"wpb_wrapper \"\u003e\u003cdiv class=\"content-txt txt-block\"\u003e\u003ch5 class=\"steelblue-color-color h5-md none\"\u003eServices\u003c/h5\u003e\u003cp\u003eThere can be a range of kidney diseases that need special attention from an advanced hospital that has all the latest technology to carry out proper tests and diagnose the disease correctly. The doctors at the hospital are efficient enough as well. Following are the types of services offered:\u003c/p\u003e\u003cdiv class=\"\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"wpb_text_column wpb_content_element \"\u003e\u003cdiv class=\"wpb_wrapper\"\u003e\u003cul\u003e\u003cli\u003eOften kidneys show an impairment in their functioning. Hospital has the facility of erythropoietin stimulating agent which helps in production of RBCs and activated vitamin D to ensure that the kidneys do not fail.\u003c/li\u003e\
